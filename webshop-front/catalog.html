<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FerShop - Katalog</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Google+Sans+Text:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS v4 -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <style type="text/tailwindcss">
        @theme {
            --color-primary: #f65904;
            --color-primary-hover: #9b3803;
            --color-primary-light: #fff0e6;
            --color-primary-superlight: #3662e40a;
            --color-secondary: #322c45;
            --color-secondary-hover: #221d33;
            --color-cream: #fafafa;
            --color-star: #f59e0b;
            --color-accent: #10b981;
            --color-dark: #111827;
            --color-dark-light: #1f2937;
            --color-light: #f9fafb;
            --color-muted: #6b7280;
            --color-muted-light: #9ca3af;
            --color-border: #e5e7eb;
            --color-white: #ffffff;
            --color-danger: #ef4444;

            --container-max-width: 1320px;
            --header-height: 64px;

            --font-heading: 'Google Sans', 'Segoe UI', sans-serif;
            --font-body: 'Google Sans Text', 'Google Sans', 'Segoe UI', sans-serif;

            --shadow-sm: 0 1px 3px rgba(0,0,0,0.04);
            --shadow-md: 0 4px 16px rgba(0,0,0,0.06);
            --shadow-lg: 0 8px 32px rgba(0,0,0,0.08);
            --shadow-dropdown: 0 10px 40px rgba(0,0,0,0.1);
            --shadow-card: 0 1px 3px rgba(0,0,0,0.03);
            --shadow-card-hover: 0 12px 40px rgba(0,0,0,0.1);

            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 20px;
            --radius-2xl: 24px;
            --radius-full: 9999px;

            --transition-fast: 150ms ease;
            --transition-base: 250ms ease;
            --transition-slow: 350ms ease;
        }

        body {
            background-color: var(--color-primary-superlight);
            font-family: var(--font-body);
        }

        [x-cloak] { display: none !important; }

        button, [role="button"], summary,
        input[type="submit"], input[type="button"], input[type="reset"] {
            cursor: pointer;
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: var(--font-heading);
        }

        .badge-pulse {
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .card-lift {
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .card-lift:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-card-hover);
        }

        .card-cart-overlay {
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .group:hover .card-cart-overlay {
            transform: translateY(0);
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Range slider custom */
        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            height: 4px;
            background: var(--color-border);
            border-radius: 2px;
            outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--color-primary);
            cursor: pointer;
            border: 2px solid white;
            box-shadow: 0 1px 4px rgba(0,0,0,0.2);
        }

        /* Custom checkbox */
        .filter-checkbox {
            accent-color: var(--color-primary);
        }

        /* Styled thin scrollbar for sidebar */
        .styled-scrollbar {
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: var(--color-border) transparent;
        }
        .styled-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .styled-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .styled-scrollbar::-webkit-scrollbar-thumb {
            background-color: var(--color-border);
            border-radius: 4px;
        }
        .styled-scrollbar:hover::-webkit-scrollbar-thumb {
            background-color: var(--color-muted-light);
        }
    </style>

    <!-- Shared App Data -->
    <script src="js/app.js"></script>
</head>

<body x-data="catalogData()" x-cloak>

    <!-- HEADER (loaded via component) -->
    <div data-include="header"></div>
    <template data-include="product-card"></template>

    <!-- ============================================= -->
    <!-- BREADCRUMB                                    -->
    <!-- ============================================= -->
    <div class="bg-white border-b border-border">
        <div class="max-w-[var(--container-max-width)] mx-auto px-4 py-3">
            <nav class="flex items-center gap-2 text-sm text-muted">
                <a href="homepage.html" class="hover:text-primary transition-colors">Početna</a>
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
                <span class="text-dark font-medium" x-text="activeCategory || 'Svi proizvodi'"></span>
                <template x-if="activeSubcategory">
                    <span class="flex items-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
                        <span class="text-dark font-medium" x-text="activeSubcategory"></span>
                    </span>
                </template>
            </nav>
        </div>
    </div>

    <!-- ============================================= -->
    <!-- CATALOG MAIN                                  -->
    <!-- ============================================= -->
    <div class="max-w-[var(--container-max-width)] mx-auto px-4 py-8">
        <div class="flex gap-8">

            <!-- ========== SIDEBAR FILTERS ========== -->
            <aside class="hidden lg:block w-[280px] shrink-0">
                <div class="sticky top-4 space-y-6">

                    <!-- Category Filter (collapsible + scrollable) -->
                    <div class="bg-white rounded-[var(--radius-lg)] shadow-[var(--shadow-sm)] overflow-hidden" x-data="{ open: true }">
                        <button @click="open = !open" class="w-full flex items-center justify-between px-5 py-4">
                            <h3 class="font-heading font-bold text-dark">Kategorije</h3>
                            <svg class="w-4 h-4 text-muted transition-transform duration-200" :class="open ? 'rotate-180' : ''" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                        </button>
                        <div x-show="open" x-collapse>
                            <div class="max-h-[320px] styled-scrollbar px-5 pb-5 pr-3">
                                <ul class="space-y-1">
                                    <li>
                                        <button @click="activeCategory = ''; activeSubcategory = ''" class="w-full text-left px-3 py-2 rounded-[var(--radius-sm)] text-sm transition-colors" :class="activeCategory === '' ? 'bg-primary-light text-primary font-medium' : 'text-muted hover:bg-light'">
                                            Svi proizvodi
                                        </button>
                                    </li>
                                    <template x-for="cat in categories" :key="cat.slug">
                                        <li>
                                            <button @click="activeCategory = (activeCategory === cat.name ? '' : cat.name); activeSubcategory = ''" class="w-full text-left px-3 py-2 rounded-[var(--radius-sm)] text-sm transition-colors flex items-center justify-between" :class="activeCategory === cat.name ? 'bg-primary-light text-primary font-medium' : 'text-muted hover:bg-light'">
                                                <span x-text="cat.name"></span>
                                                <div class="flex items-center gap-1.5">
                                                    <span class="text-xs text-muted-light" x-text="'(' + getProductCount(cat.name) + ')'"></span>
                                                    <svg class="w-3 h-3 transition-transform duration-200" :class="activeCategory === cat.name ? 'rotate-180 text-primary' : 'text-muted-light'" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                                                </div>
                                            </button>
                                            <!-- Subcategories -->
                                            <ul x-show="activeCategory === cat.name" x-transition class="ml-4 mt-1 space-y-0.5">
                                                <template x-for="sub in cat.subcategories" :key="sub">
                                                    <li>
                                                        <button @click.stop="activeSubcategory = (activeSubcategory === sub ? '' : sub)" class="w-full text-left px-3 py-1.5 rounded-[var(--radius-sm)] text-xs transition-colors" :class="activeSubcategory === sub ? 'bg-primary text-white font-medium' : 'text-muted hover:bg-light'">
                                                            <span x-text="sub"></span>
                                                        </button>
                                                    </li>
                                                </template>
                                            </ul>
                                        </li>
                                    </template>
                                </ul>
                            </div>
                        </div>
                    </div>

                    <!-- Price Filter (collapsible) -->
                    <div class="bg-white rounded-[var(--radius-lg)] shadow-[var(--shadow-sm)] overflow-hidden" x-data="{ open: true }">
                        <button @click="open = !open" class="w-full flex items-center justify-between px-5 py-4">
                            <h3 class="font-heading font-bold text-dark">Cijena</h3>
                            <svg class="w-4 h-4 text-muted transition-transform duration-200" :class="open ? 'rotate-180' : ''" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                        </button>
                        <div x-show="open" x-collapse>
                            <div class="px-5 pb-5 space-y-3">
                                <div class="flex items-center gap-3">
                                    <div class="flex-1">
                                        <label class="text-xs text-muted mb-1 block">Min</label>
                                        <input type="number" x-model.number="priceMin" min="0" class="w-full px-3 py-2 text-sm border border-border rounded-[var(--radius-sm)] focus:outline-none focus:border-primary" placeholder="0">
                                    </div>
                                    <span class="text-muted mt-5">—</span>
                                    <div class="flex-1">
                                        <label class="text-xs text-muted mb-1 block">Max</label>
                                        <input type="number" x-model.number="priceMax" min="0" class="w-full px-3 py-2 text-sm border border-border rounded-[var(--radius-sm)] focus:outline-none focus:border-primary" placeholder="5000">
                                    </div>
                                </div>
                                <input type="range" x-model.number="priceMax" min="0" max="3000" step="50" class="w-full">
                                <div class="flex justify-between text-xs text-muted">
                                    <span x-text="priceMin + ' €'"></span>
                                    <span x-text="priceMax + ' €'"></span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- On Sale Filter (collapsible) -->
                    <div class="bg-white rounded-[var(--radius-lg)] shadow-[var(--shadow-sm)] overflow-hidden" x-data="{ open: true }">
                        <button @click="open = !open" class="w-full flex items-center justify-between px-5 py-4">
                            <h3 class="font-heading font-bold text-dark">Posebne ponude</h3>
                            <svg class="w-4 h-4 text-muted transition-transform duration-200" :class="open ? 'rotate-180' : ''" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                        </button>
                        <div x-show="open" x-collapse>
                            <div class="px-5 pb-5">
                                <label class="flex items-center gap-3 cursor-pointer">
                                    <input type="checkbox" x-model="onlyOnSale" class="filter-checkbox w-4 h-4 rounded">
                                    <span class="text-sm text-dark">Samo sniženo</span>
                                </label>
                            </div>
                        </div>
                    </div>

                    <!-- Reset Filters -->
                    <button @click="resetFilters()" class="w-full py-2.5 text-sm font-medium text-muted border border-border rounded-[var(--radius-md)] hover:bg-light transition-colors">
                        Poništi filtere
                    </button>
                </div>
            </aside>

            <!-- ========== PRODUCT GRID ========== -->
            <div class="flex-1 min-w-0">

                <!-- Top Bar: Result count + Sort + Grid toggle -->
                <div class="flex flex-wrap items-center justify-between gap-4 mb-6">
                    <div>
                        <h1 class="font-heading font-bold text-2xl text-dark" x-text="activeCategory || 'Svi proizvodi'"></h1>
                        <p class="text-sm text-muted mt-1">
                            <span x-text="filteredProducts.length"></span> proizvod<span x-text="filteredProducts.length === 1 ? '' : 'a'"></span>
                        </p>
                    </div>

                    <div class="flex items-center gap-3">
                        <!-- Mobile filter toggle -->
                        <button @click="mobileFilters = !mobileFilters" class="lg:hidden flex items-center gap-2 px-4 py-2 text-sm font-medium border border-border rounded-[var(--radius-md)] hover:bg-light transition-colors">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"/></svg>
                            Filteri
                        </button>

                        <!-- Sort -->
                        <div class="relative" x-data="{ sortOpen: false }">
                            <button @click="sortOpen = !sortOpen" class="flex items-center gap-2 px-4 py-2 text-sm font-medium border border-border rounded-[var(--radius-md)] hover:bg-light transition-colors bg-white">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4h13M3 8h9m-9 4h6m4 0l4-4m0 0l4 4m-4-4v12"/></svg>
                                <span x-text="sortLabel"></span>
                                <svg class="w-3 h-3 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                            </button>
                            <div x-show="sortOpen" @click.away="sortOpen = false" x-transition class="absolute right-0 mt-2 w-52 bg-white rounded-[var(--radius-md)] shadow-[var(--shadow-dropdown)] border border-border z-30 py-1">
                                <template x-for="opt in sortOptions" :key="opt.value">
                                    <button @click="sortBy = opt.value; sortOpen = false" class="w-full text-left px-4 py-2 text-sm transition-colors" :class="sortBy === opt.value ? 'bg-primary-light text-primary font-medium' : 'text-dark hover:bg-light'" x-text="opt.label"></button>
                                </template>
                            </div>
                        </div>

                        <!-- Grid toggle -->
                        <div class="hidden sm:flex items-center border border-border rounded-[var(--radius-md)] overflow-hidden">
                            <button @click="gridCols = 3" class="p-2 transition-colors" :class="gridCols === 3 ? 'bg-primary text-white' : 'bg-white text-muted hover:bg-light'">
                                <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 16 16"><rect x="0" y="0" width="4" height="4" rx="1"/><rect x="6" y="0" width="4" height="4" rx="1"/><rect x="12" y="0" width="4" height="4" rx="1"/><rect x="0" y="6" width="4" height="4" rx="1"/><rect x="6" y="6" width="4" height="4" rx="1"/><rect x="12" y="6" width="4" height="4" rx="1"/></svg>
                            </button>
                            <button @click="gridCols = 4" class="p-2 transition-colors" :class="gridCols === 4 ? 'bg-primary text-white' : 'bg-white text-muted hover:bg-light'">
                                <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 16 16"><rect x="0" y="0" width="3" height="3" rx="0.5"/><rect x="4.33" y="0" width="3" height="3" rx="0.5"/><rect x="8.66" y="0" width="3" height="3" rx="0.5"/><rect x="13" y="0" width="3" height="3" rx="0.5"/><rect x="0" y="4.33" width="3" height="3" rx="0.5"/><rect x="4.33" y="4.33" width="3" height="3" rx="0.5"/><rect x="8.66" y="4.33" width="3" height="3" rx="0.5"/><rect x="13" y="4.33" width="3" height="3" rx="0.5"/></svg>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Active Filters Tags -->
                <div x-show="activeCategory || activeSubcategory || onlyOnSale || priceMin > 0 || priceMax < 3000" class="flex flex-wrap gap-2 mb-6">
                    <template x-if="activeCategory">
                        <span class="inline-flex items-center gap-1.5 px-3 py-1.5 bg-primary-light text-primary text-xs font-medium rounded-full">
                            <span x-text="activeCategory"></span>
                            <button @click="activeCategory = ''; activeSubcategory = ''" class="hover:text-primary-hover">
                                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                            </button>
                        </span>
                    </template>
                    <template x-if="activeSubcategory">
                        <span class="inline-flex items-center gap-1.5 px-3 py-1.5 bg-primary-light text-primary text-xs font-medium rounded-full">
                            <span x-text="activeSubcategory"></span>
                            <button @click="activeSubcategory = ''" class="hover:text-primary-hover">
                                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                            </button>
                        </span>
                    </template>
                    <template x-if="onlyOnSale">
                        <span class="inline-flex items-center gap-1.5 px-3 py-1.5 bg-danger/10 text-danger text-xs font-medium rounded-full">
                            Samo sniženo
                            <button @click="onlyOnSale = false" class="hover:text-danger">
                                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                            </button>
                        </span>
                    </template>
                    <template x-if="priceMin > 0 || priceMax < 3000">
                        <span class="inline-flex items-center gap-1.5 px-3 py-1.5 bg-light text-muted text-xs font-medium rounded-full border border-border">
                            <span x-text="priceMin + '€ — ' + priceMax + '€'"></span>
                            <button @click="priceMin = 0; priceMax = 3000">
                                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                            </button>
                        </span>
                    </template>
                </div>

                <!-- Product Grid -->
                <div class="grid gap-5" :class="gridCols === 4 ? 'grid-cols-2 sm:grid-cols-3 xl:grid-cols-4' : 'grid-cols-1 sm:grid-cols-2 lg:grid-cols-3'">
                    <template x-for="product in filteredProducts" :key="product.name">
                        <div x-data="{ badge: null, badgeIdx: 0, showPreview: true }"
                             x-init="$nextTick(() => mountCard($el))"></div>
                    </template>
                </div>

                <!-- Empty State -->
                <div x-show="filteredProducts.length === 0" class="text-center py-20">
                    <svg class="w-16 h-16 text-muted-light mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                    <h3 class="font-heading font-bold text-dark text-lg mb-2">Nema rezultata</h3>
                    <p class="text-muted text-sm mb-4">Pokušajte s drugačijim filterima ili kategorijom.</p>
                    <button @click="resetFilters()" class="px-6 py-2.5 bg-primary text-white text-sm font-medium rounded-[var(--radius-md)] hover:bg-primary-hover transition-colors">
                        Poništi filtere
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- ============================================= -->
    <!-- MOBILE FILTERS DRAWER                         -->
    <!-- ============================================= -->
    <div x-show="mobileFilters" x-transition:enter="transition ease-out duration-300" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100" x-transition:leave="transition ease-in duration-200" x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0" class="fixed inset-0 bg-black/50 z-50 lg:hidden" @click.self="mobileFilters = false">
        <div x-show="mobileFilters" x-transition:enter="transition ease-out duration-300" x-transition:enter-start="translate-x-[-100%]" x-transition:enter-end="translate-x-0" x-transition:leave="transition ease-in duration-200" x-transition:leave-start="translate-x-0" x-transition:leave-end="translate-x-[-100%]" class="w-[320px] h-full bg-white overflow-y-auto">
            <div class="p-5">
                <div class="flex items-center justify-between mb-6">
                    <h2 class="font-heading font-bold text-lg text-dark">Filteri</h2>
                    <button @click="mobileFilters = false" class="w-9 h-9 flex items-center justify-center rounded-full hover:bg-light transition-colors">
                        <svg class="w-5 h-5 text-muted" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                    </button>
                </div>

                <!-- Category Filter (mobile) -->
                <div class="mb-6">
                    <h3 class="font-heading font-bold text-dark mb-3">Kategorije</h3>
                    <ul class="space-y-1">
                        <li>
                            <button @click="activeCategory = ''; activeSubcategory = ''" class="w-full text-left px-3 py-2 rounded-[var(--radius-sm)] text-sm transition-colors" :class="activeCategory === '' ? 'bg-primary-light text-primary font-medium' : 'text-muted hover:bg-light'">
                                Svi proizvodi
                            </button>
                        </li>
                        <template x-for="cat in categories" :key="cat.slug">
                            <li>
                                <button @click="activeCategory = cat.name; activeSubcategory = ''" class="w-full text-left px-3 py-2 rounded-[var(--radius-sm)] text-sm transition-colors" :class="activeCategory === cat.name ? 'bg-primary-light text-primary font-medium' : 'text-muted hover:bg-light'" x-text="cat.name"></button>
                            </li>
                        </template>
                    </ul>
                </div>

                <!-- Price Filter (mobile) -->
                <div class="mb-6">
                    <h3 class="font-heading font-bold text-dark mb-3">Cijena</h3>
                    <div class="flex items-center gap-3">
                        <div class="flex-1">
                            <input type="number" x-model.number="priceMin" min="0" class="w-full px-3 py-2 text-sm border border-border rounded-[var(--radius-sm)] focus:outline-none focus:border-primary" placeholder="Min">
                        </div>
                        <span class="text-muted">—</span>
                        <div class="flex-1">
                            <input type="number" x-model.number="priceMax" min="0" class="w-full px-3 py-2 text-sm border border-border rounded-[var(--radius-sm)] focus:outline-none focus:border-primary" placeholder="Max">
                        </div>
                    </div>
                </div>

                <!-- On Sale (mobile) -->
                <div class="mb-6">
                    <label class="flex items-center gap-3 cursor-pointer">
                        <input type="checkbox" x-model="onlyOnSale" class="filter-checkbox w-4 h-4 rounded">
                        <span class="text-sm text-dark">Samo sniženo</span>
                    </label>
                </div>

                <div class="flex gap-3">
                    <button @click="resetFilters(); mobileFilters = false" class="flex-1 py-2.5 text-sm font-medium border border-border rounded-[var(--radius-md)] hover:bg-light transition-colors">
                        Poništi
                    </button>
                    <button @click="mobileFilters = false" class="flex-1 py-2.5 text-sm font-medium bg-primary text-white rounded-[var(--radius-md)] hover:bg-primary-hover transition-colors">
                        Primijeni
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- FOOTER (loaded via component) -->
    <div data-include="footer"></div>

    <!-- Alpine Collapse plugin (before Alpine loads) -->
    <script src="https://cdn.jsdelivr.net/npm/@alpinejs/collapse@3.x.x/dist/cdn.min.js" defer></script>

    <!-- Component Loader (MUST be last) -->
    <script src="js/components.js"></script>

    <!-- Catalog-specific logic -->
    <script>
        function catalogData() {
            const base = appData();
            return {
                ...base,
                activeCategory: '',
                activeSubcategory: '',
                priceMin: 0,
                priceMax: 3000,
                onlyOnSale: false,
                sortBy: 'default',
                gridCols: 3,
                mobileFilters: false,

                sortOptions: [
                    { value: 'default', label: 'Preporučeno' },
                    { value: 'price-asc', label: 'Cijena: najniža' },
                    { value: 'price-desc', label: 'Cijena: najviša' },
                    { value: 'name-asc', label: 'Naziv: A-Z' },
                    { value: 'name-desc', label: 'Naziv: Z-A' },
                    { value: 'discount', label: 'Najveći popust' },
                ],

                get sortLabel() {
                    const opt = this.sortOptions.find(o => o.value === this.sortBy);
                    return opt ? opt.label : 'Sortiraj';
                },

                get filteredProducts() {
                    let result = this.products;

                    if (this.activeCategory) {
                        result = result.filter(p => p.category === this.activeCategory);
                    }
                    if (this.activeSubcategory) {
                        result = result.filter(p => p.subcategory === this.activeSubcategory);
                    }
                    if (this.onlyOnSale) {
                        result = result.filter(p => p.oldPrice);
                    }
                    result = result.filter(p => p.price >= this.priceMin && p.price <= this.priceMax);

                    // Sort
                    switch (this.sortBy) {
                        case 'price-asc': result.sort((a, b) => a.price - b.price); break;
                        case 'price-desc': result.sort((a, b) => b.price - a.price); break;
                        case 'name-asc': result.sort((a, b) => a.name.localeCompare(b.name)); break;
                        case 'name-desc': result.sort((a, b) => b.name.localeCompare(a.name)); break;
                        case 'discount': result.sort((a, b) => {
                            const dA = a.oldPrice ? (1 - a.price / a.oldPrice) : 0;
                            const dB = b.oldPrice ? (1 - b.price / b.oldPrice) : 0;
                            return dB - dA;
                        }); break;
                    }

                    return result;
                },

                getProductCount(categoryName) {
                    return this.products.filter(p => p.category === categoryName).length;
                },

                resetFilters() {
                    this.activeCategory = '';
                    this.activeSubcategory = '';
                    this.priceMin = 0;
                    this.priceMax = 3000;
                    this.onlyOnSale = false;
                    this.sortBy = 'default';
                },
            };
        }
    </script>

</body>
</html>

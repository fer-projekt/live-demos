<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FerShop - Proizvod</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Google+Sans+Text:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS v4 -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <style type="text/tailwindcss">
        @theme {
            --color-primary: #f65904;
            --color-primary-hover: #9b3803;
            --color-primary-light: #fff0e6;
            --color-primary-superlight: #3662e40a;
            --color-secondary: #322c45;
            --color-secondary-hover: #221d33;
            --color-cream: #fafafa;
            --color-star: #f59e0b;
            --color-accent: #10b981;
            --color-dark: #111827;
            --color-dark-light: #1f2937;
            --color-light: #f9fafb;
            --color-muted: #6b7280;
            --color-muted-light: #9ca3af;
            --color-border: #e5e7eb;
            --color-white: #ffffff;
            --color-danger: #ef4444;

            --container-max-width: 1320px;
            --header-height: 64px;

            --font-heading: 'Google Sans', 'Segoe UI', sans-serif;
            --font-body: 'Google Sans Text', 'Google Sans', 'Segoe UI', sans-serif;

            --shadow-sm: 0 1px 3px rgba(0,0,0,0.04);
            --shadow-md: 0 4px 16px rgba(0,0,0,0.06);
            --shadow-lg: 0 8px 32px rgba(0,0,0,0.08);
            --shadow-dropdown: 0 10px 40px rgba(0,0,0,0.1);
            --shadow-card: 0 1px 3px rgba(0,0,0,0.03);
            --shadow-card-hover: 0 12px 40px rgba(0,0,0,0.1);

            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 20px;
            --radius-2xl: 24px;
            --radius-full: 9999px;

            --transition-fast: 150ms ease;
            --transition-base: 250ms ease;
            --transition-slow: 350ms ease;
        }

        body {
            background-color: var(--color-primary-superlight);
            font-family: var(--font-body);
        }

        [x-cloak] { display: none !important; }

        button, [role="button"], summary,
        input[type="submit"], input[type="button"], input[type="reset"] {
            cursor: pointer;
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: var(--font-heading);
        }

        .badge-pulse {
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .card-lift {
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .card-lift:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-card-hover);
        }

        .card-cart-overlay {
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .group:hover .card-cart-overlay {
            transform: translateY(0);
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Product main image */
        .product-image-wrap {
            overflow: hidden;
        }

        /* Thumbnail active ring */
        .thumb-ring {
            outline: 2px solid transparent;
            outline-offset: 2px;
            transition: outline-color var(--transition-fast);
        }
        .thumb-ring.active {
            outline-color: var(--color-primary);
        }

        /* Quantity input no spinners */
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] {
            -moz-appearance: textfield;
        }

        /* Spec table stripes */
        .spec-row:nth-child(even) {
            background-color: var(--color-light);
        }
    </style>

    <!-- Shared App Data -->
    <script src="js/app.js"></script>
</head>

<body x-data="productData()" x-cloak @scroll.window="showStickyBar = window.scrollY > 500">

    <!-- HEADER -->
    <div data-include="header"></div>

    <!-- ============================================= -->
    <!-- BREADCRUMB                                    -->
    <!-- ============================================= -->
    <div class="bg-white border-b border-border">
        <div class="max-w-[var(--container-max-width)] mx-auto px-4 py-3">
            <nav class="flex items-center gap-2 text-sm text-muted">
                <a href="homepage.html" class="hover:text-primary transition-colors">Početna</a>
                <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
                <a href="catalog.html" class="hover:text-primary transition-colors" x-text="product.category"></a>
                <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
                <span class="text-dark font-medium truncate" x-text="product.name"></span>
            </nav>
        </div>
    </div>

    <!-- ============================================= -->
    <!-- PRODUCT HERO                                  -->
    <!-- ============================================= -->
    <div class="max-w-[var(--container-max-width)] mx-auto px-4 py-8">
        <div class="flex flex-col lg:flex-row gap-8 lg:gap-12">

            <!-- ========== GALLERY (Left) ========== -->
            <div class="lg:w-[50%]">
                <!-- Main Image -->
                <div class="product-image-wrap bg-white rounded-[var(--radius-xl)] shadow-[var(--shadow-sm)] mb-4 ">
                    <img :src="mainImage" :alt="product.name" class="w-full aspect-square h-[50vh] object-cover rounded-[var(--radius-xl)]">
                </div>
                <!-- Thumbnails -->
                <div class="flex gap-3">
                    <template x-for="(img, i) in galleryImages" :key="i">
                        <button @click="selectedImage = i"
                                class="w-20 h-20 rounded-[var(--radius-md)] overflow-hidden bg-white shadow-[var(--shadow-sm)] thumb-ring"
                                :class="selectedImage === i ? 'active' : ''">
                            <img :src="img.replace('600/600', '100/100')" :alt="'Slika ' + (i+1)" class="w-full h-full object-cover">
                        </button>
                    </template>
                </div>
            </div>

            <!-- ========== PRODUCT INFO (Right) ========== -->
            <div class="lg:w-[50%]" id="product-info">
                <!-- Category -->
                <p class="text-xs font-semibold uppercase tracking-wider text-primary mb-2" x-text="product.subcategory"></p>

                <!-- Name -->
                <h1 class="font-heading font-bold text-2xl lg:text-3xl text-dark leading-tight mb-3" x-text="product.name"></h1>

                <!-- Rating -->
                <div class="flex items-center gap-3 mb-5">
                    <div class="flex items-center gap-0.5">
                        <template x-for="i in 5" :key="i">
                            <svg class="w-4.5 h-4.5" :class="i <= Math.round(productRating) ? 'text-star' : 'text-border'" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>
                        </template>
                    </div>
                    <span class="text-sm text-muted" x-text="productRating.toFixed(1)"></span>
                    <button @click="activeTab = 'recenzije'; $nextTick(() => document.getElementById('tabs-section').scrollIntoView({behavior: 'smooth'}))" class="text-sm text-primary hover:underline" x-text="'(' + productReviewCount + ' recenzija)'"></button>
                </div>

                <!-- Price -->
                <div class="flex items-center gap-4 mb-5">
                    <span class="font-heading font-bold text-3xl text-dark" x-text="product.price.toFixed(2) + ' €'"></span>
                    <template x-if="product.oldPrice">
                        <span class="text-lg text-muted line-through" x-text="product.oldPrice.toFixed(2) + ' €'"></span>
                    </template>
                    <template x-if="discountPercent > 0">
                        <span class="bg-danger text-white text-sm font-bold px-2.5 py-1 rounded-full" x-text="'-' + discountPercent + '%'"></span>
                    </template>
                </div>

                <!-- Description -->
                <p class="text-muted leading-relaxed mb-6" x-text="productDescription"></p>

                <div class="border-t border-border pt-6 space-y-5">
                    <!-- Quantity + Add to Cart -->
                    <div class="flex items-center gap-4">
                        <!-- Quantity Selector -->
                        <div class="flex items-center border border-border rounded-[var(--radius-md)] overflow-hidden">
                            <button @click="if(quantity > 1) quantity--" class="w-11 h-12 flex items-center justify-center text-muted hover:bg-light hover:text-dark transition-colors">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4"/></svg>
                            </button>
                            <input type="number" x-model.number="quantity" min="1" max="99" class="w-14 h-12 text-center text-sm font-medium border-x border-border focus:outline-none">
                            <button @click="if(quantity < 99) quantity++" class="w-11 h-12 flex items-center justify-center text-muted hover:bg-light hover:text-dark transition-colors">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                            </button>
                        </div>

                        <!-- Add to Cart Button -->
                        <button @click="addToCart(product, quantity); addedToCart = true; setTimeout(() => addedToCart = false, 2000)"
                                class="flex-1 py-3.5 rounded-[var(--radius-md)] font-medium text-sm flex items-center justify-center gap-2 transition-all duration-200"
                                :class="addedToCart ? 'bg-accent text-white' : 'bg-primary text-white hover:bg-primary-hover'">
                            <template x-if="!addedToCart">
                                <span class="flex items-center gap-2">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 100 4 2 2 0 000-4z"/></svg>
                                    Dodaj u košaricu
                                </span>
                            </template>
                            <template x-if="addedToCart">
                                <span class="flex items-center gap-2">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
                                    Dodano!
                                </span>
                            </template>
                        </button>
                    </div>

                    <!-- Wishlist -->
                    <button @click="wishlisted = !wishlisted"
                            class="w-full py-3 rounded-[var(--radius-md)] font-medium text-sm flex items-center justify-center gap-2 border transition-colors"
                            :class="wishlisted ? 'border-primary bg-primary-light text-primary' : 'border-border text-muted hover:border-primary hover:text-primary'">
                        <svg class="w-5 h-5" :fill="wishlisted ? 'currentColor' : 'none'" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/></svg>
                        <span x-text="wishlisted ? 'Na listi želja' : 'Dodaj na listu želja'"></span>
                    </button>

                    <div class="border-t border-border pt-5 space-y-3">
                        <!-- Availability -->
                        <div class="flex items-center gap-2">
                            <span class="w-2.5 h-2.5 rounded-full bg-accent"></span>
                            <span class="text-sm text-dark font-medium">Na skladištu</span>
                        </div>
                        <!-- SKU -->
                        <p class="text-xs text-muted">Šifra: <span x-text="productSku"></span></p>
                        <!-- Category -->
                        <p class="text-xs text-muted">Kategorija: <a href="catalog.html" class="text-primary hover:underline" x-text="product.category + ' / ' + product.subcategory"></a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ============================================= -->
    <!-- TRUST SIGNALS                                 -->
    <!-- ============================================= -->
    <div class="border-y border-border bg-white">
        <div class="max-w-[var(--container-max-width)] mx-auto px-4 py-6">
            <div class="grid grid-cols-2 md:grid-cols-4 gap-6">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full bg-primary-light flex items-center justify-center shrink-0">
                        <svg class="w-5 h-5 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 8h14M5 8a2 2 0 110-4h14a2 2 0 110 4M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8m-9 4h4"/></svg>
                    </div>
                    <div>
                        <p class="text-sm font-medium text-dark">Besplatna dostava</p>
                        <p class="text-xs text-muted">Za narudžbe iznad 50€</p>
                    </div>
                </div>
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full bg-primary-light flex items-center justify-center shrink-0">
                        <svg class="w-5 h-5 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                    </div>
                    <div>
                        <p class="text-sm font-medium text-dark">Povrat u 30 dana</p>
                        <p class="text-xs text-muted">Bez komplikacija</p>
                    </div>
                </div>
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full bg-primary-light flex items-center justify-center shrink-0">
                        <svg class="w-5 h-5 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
                    </div>
                    <div>
                        <p class="text-sm font-medium text-dark">Sigurno plaćanje</p>
                        <p class="text-xs text-muted">SSL zaštita podataka</p>
                    </div>
                </div>
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full bg-primary-light flex items-center justify-center shrink-0">
                        <svg class="w-5 h-5 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 5.636l-3.536 3.536m0 5.656l3.536 3.536M9.172 9.172L5.636 5.636m3.536 9.192l-3.536 3.536M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-5 0a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
                    </div>
                    <div>
                        <p class="text-sm font-medium text-dark">Podrška 24/7</p>
                        <p class="text-xs text-muted">Uvijek tu za vas</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ============================================= -->
    <!-- TABS: Opis / Specifikacije / Recenzije        -->
    <!-- ============================================= -->
    <div class="max-w-[var(--container-max-width)] mx-auto px-4 py-10" id="tabs-section">
        <!-- Tab Headers -->
        <div class="border-b border-border mb-8">
            <div class="flex gap-8">
                <button @click="activeTab = 'opis'" class="pb-3 text-sm font-medium border-b-2 transition-colors" :class="activeTab === 'opis' ? 'border-primary text-primary' : 'border-transparent text-muted hover:text-dark'">Opis proizvoda</button>
                <button @click="activeTab = 'specifikacije'" class="pb-3 text-sm font-medium border-b-2 transition-colors" :class="activeTab === 'specifikacije' ? 'border-primary text-primary' : 'border-transparent text-muted hover:text-dark'">Specifikacije</button>
                <button @click="activeTab = 'recenzije'" class="pb-3 text-sm font-medium border-b-2 transition-colors" :class="activeTab === 'recenzije' ? 'border-primary text-primary' : 'border-transparent text-muted hover:text-dark'">
                    Recenzije <span class="text-xs text-muted-light" x-text="'(' + productReviewCount + ')'"></span>
                </button>
            </div>
        </div>

        <!-- Tab: Opis -->
        <div x-show="activeTab === 'opis'" class="max-w-3xl">
            <div class="space-y-4 text-muted leading-relaxed">
                <p x-text="productDescriptionLong"></p>
                <h3 class="font-heading font-bold text-dark text-lg pt-2">Značajke</h3>
                <ul class="space-y-2">
                    <template x-for="feature in productFeatures" :key="feature">
                        <li class="flex items-start gap-2">
                            <svg class="w-5 h-5 text-accent shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
                            <span x-text="feature"></span>
                        </li>
                    </template>
                </ul>
            </div>
        </div>

        <!-- Tab: Specifikacije -->
        <div x-show="activeTab === 'specifikacije'" class="max-w-3xl">
            <div class="rounded-[var(--radius-lg)] border border-border overflow-hidden">
                <template x-for="(spec, i) in productSpecs" :key="i">
                    <div class="flex spec-row">
                        <div class="w-1/3 px-5 py-3.5 text-sm font-medium text-dark bg-light/50" x-text="spec.label"></div>
                        <div class="w-2/3 px-5 py-3.5 text-sm text-muted" x-text="spec.value"></div>
                    </div>
                </template>
            </div>
        </div>

        <!-- Tab: Recenzije -->
        <div x-show="activeTab === 'recenzije'" class="max-w-3xl">
            <!-- Review Summary -->
            <div class="flex items-center gap-6 mb-8 p-6 bg-white rounded-[var(--radius-lg)] shadow-[var(--shadow-sm)]">
                <div class="text-center">
                    <div class="font-heading font-bold text-4xl text-dark" x-text="productRating.toFixed(1)"></div>
                    <div class="flex items-center gap-0.5 mt-1">
                        <template x-for="i in 5" :key="i">
                            <svg class="w-4 h-4" :class="i <= Math.round(productRating) ? 'text-star' : 'text-border'" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>
                        </template>
                    </div>
                    <p class="text-xs text-muted mt-1" x-text="productReviewCount + ' recenzija'"></p>
                </div>
                <div class="flex-1 space-y-1.5">
                    <template x-for="bar in ratingBars" :key="bar.stars">
                        <div class="flex items-center gap-2">
                            <span class="text-xs text-muted w-4 text-right" x-text="bar.stars"></span>
                            <svg class="w-3.5 h-3.5 text-star" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>
                            <div class="flex-1 h-2 bg-border/50 rounded-full overflow-hidden">
                                <div class="h-full bg-star rounded-full" :style="'width:' + bar.percent + '%'"></div>
                            </div>
                            <span class="text-xs text-muted w-8" x-text="bar.percent + '%'"></span>
                        </div>
                    </template>
                </div>
            </div>

            <!-- Review List -->
            <div class="space-y-6">
                <template x-for="review in productReviews" :key="review.name">
                    <div class="bg-white rounded-[var(--radius-lg)] p-6 shadow-[var(--shadow-sm)]">
                        <div class="flex items-start gap-4">
                            <img :src="review.avatar" :alt="review.name" class="w-10 h-10 rounded-full object-cover shrink-0">
                            <div class="flex-1">
                                <div class="flex items-center justify-between mb-1">
                                    <h4 class="font-medium text-dark text-sm" x-text="review.name"></h4>
                                    <span class="text-xs text-muted" x-text="review.date"></span>
                                </div>
                                <div class="flex items-center gap-0.5 mb-3">
                                    <template x-for="i in 5" :key="i">
                                        <svg class="w-3.5 h-3.5" :class="i <= review.rating ? 'text-star' : 'text-border'" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>
                                    </template>
                                </div>
                                <p class="text-sm text-muted leading-relaxed" x-text="review.text"></p>
                            </div>
                        </div>
                    </div>
                </template>
            </div>
        </div>
    </div>

    <!-- ============================================= -->
    <!-- RELATED PRODUCTS                              -->
    <!-- ============================================= -->
    <div class="max-w-[var(--container-max-width)] mx-auto px-4 pb-12">
        <div class="flex items-center justify-between mb-6">
            <h2 class="font-heading font-bold text-xl text-dark">Slični proizvodi</h2>
            <a href="catalog.html" class="text-sm font-medium text-primary hover:underline flex items-center gap-1">
                Pogledaj sve
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
            </a>
        </div>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-5">
            <template x-for="rp in relatedProducts" :key="rp.name">
                <a :href="'product.html?slug=' + getProductSlug(rp)" class="group bg-white rounded-[var(--radius-lg)] shadow-[var(--shadow-card)] card-lift overflow-hidden">
                    <div class="relative aspect-square bg-light overflow-hidden">
                        <img :src="rp.image.replace('80/80', '400/400')" :alt="rp.name" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                        <template x-if="rp.oldPrice">
                            <span class="absolute top-3 left-3 bg-danger text-white text-xs font-bold px-2.5 py-1 rounded-full" x-text="'-' + Math.round((1 - rp.price / rp.oldPrice) * 100) + '%'"></span>
                        </template>
                    </div>
                    <div class="p-4">
                        <p class="text-xs text-primary font-semibold uppercase tracking-wider mb-1" x-text="rp.category"></p>
                        <h3 class="font-heading font-semibold text-dark text-sm leading-snug mb-2 line-clamp-2" x-text="rp.name"></h3>
                        <div class="flex items-center gap-2">
                            <span class="font-heading font-bold text-dark" x-text="rp.price.toFixed(2) + ' €'"></span>
                            <template x-if="rp.oldPrice">
                                <span class="text-xs text-muted line-through" x-text="rp.oldPrice.toFixed(2) + ' €'"></span>
                            </template>
                        </div>
                    </div>
                </a>
            </template>
        </div>
    </div>

    <!-- ============================================= -->
    <!-- MOBILE STICKY ADD TO CART                     -->
    <!-- ============================================= -->
    <div x-show="showStickyBar" x-transition:enter="transition ease-out duration-300" x-transition:enter-start="translate-y-full" x-transition:enter-end="translate-y-0" x-transition:leave="transition ease-in duration-200" x-transition:leave-start="translate-y-0" x-transition:leave-end="translate-y-full"
         class="fixed bottom-0 left-0 right-0 bg-white border-t border-border shadow-[var(--shadow-lg)] z-40 p-4 lg:hidden">
        <div class="flex items-center justify-between gap-4">
            <div>
                <p class="font-heading font-bold text-lg text-dark" x-text="product.price.toFixed(2) + ' €'"></p>
                <template x-if="product.oldPrice">
                    <p class="text-xs text-muted line-through" x-text="product.oldPrice.toFixed(2) + ' €'"></p>
                </template>
            </div>
            <button @click="addToCart(product, 1); addedToCart = true; setTimeout(() => addedToCart = false, 2000)"
                    class="flex-1 max-w-[240px] py-3 rounded-[var(--radius-md)] font-medium text-sm flex items-center justify-center gap-2 transition-all"
                    :class="addedToCart ? 'bg-accent text-white' : 'bg-primary text-white hover:bg-primary-hover'">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 100 4 2 2 0 000-4z"/></svg>
                <span x-text="addedToCart ? 'Dodano!' : 'Dodaj u košaricu'"></span>
            </button>
        </div>
    </div>

    <!-- FOOTER -->
    <div data-include="footer"></div>

    <!-- Alpine Collapse plugin -->
    <script src="https://cdn.jsdelivr.net/npm/@alpinejs/collapse@3.x.x/dist/cdn.min.js" defer></script>

    <!-- Component Loader (MUST be last) -->
    <script src="js/components.js"></script>

    <!-- Product Page Logic -->
    <script>
        function productData() {
            const base = appData();
            const params = new URLSearchParams(window.location.search);
            const slug = params.get('slug') || 'iphone';

            return {
                ...base,
                slug,
                quantity: 1,
                activeTab: 'opis',
                selectedImage: 0,
                showStickyBar: false,
                addedToCart: false,
                wishlisted: false,

                get product() {
                    return this.products.find(p => p.image.includes('/seed/' + this.slug + '/')) || this.products[0];
                },

                get galleryImages() {
                    const s = this.slug;
                    return [
                        `https://picsum.photos/seed/${s}/600/600`,
                        `https://picsum.photos/seed/${s}a/600/600`,
                        `https://picsum.photos/seed/${s}b/600/600`,
                        `https://picsum.photos/seed/${s}c/600/600`,
                    ];
                },

                get mainImage() {
                    return this.galleryImages[this.selectedImage];
                },

                get productRating() {
                    return 4 + (this.product.name.length % 10) / 10;
                },

                get productReviewCount() {
                    return 20 + this.product.name.length * 3;
                },

                get discountPercent() {
                    if (!this.product.oldPrice) return 0;
                    return Math.round((1 - this.product.price / this.product.oldPrice) * 100);
                },

                get productSku() {
                    const catCode = this.product.category.substring(0, 2).toUpperCase();
                    const idx = this.products.indexOf(this.product) + 1;
                    return 'FER-' + catCode + '-' + String(idx).padStart(3, '0');
                },

                get productDescription() {
                    const descs = {
                        'Elektronika': `Vrhunski ${this.product.name} s najnovijom tehnologijom. Savršen za svakodnevnu upotrebu, dizajniran za maksimalne performanse i pouzdanost.`,
                        'Odjeća': `${this.product.name} - premium kvaliteta materijala, moderan dizajn i udobnost za svaki dan. Dostupno u više veličina.`,
                        'Obuća': `${this.product.name} - spoj stila i udobnosti. Kvalitetna izrada, izdržljivi materijali i ergonomski dizajn za maksimalnu udobnost.`,
                        'Kuća i vrt': `${this.product.name} - savršen dodatak vašem domu. Funkcionalan dizajn koji kombinira estetiku i praktičnost.`,
                        'Sport': `${this.product.name} - profesionalna oprema za sportaše svih razina. Izdržljiva konstrukcija i vrhunske performanse.`,
                        'Ljepota i zdravlje': `${this.product.name} - premium njega za vašu kožu i tijelo. Provjereni sastojci i dokazani rezultati.`,
                        'Igračke': `${this.product.name} - zabava i edukacija za cijelu obitelj. Sigurni materijali, certificirana kvaliteta.`,
                        'Knjige': `${this.product.name} - savršen izbor za ljubitelje čitanja. Kvalitetno izdanje s prekrasnim dizajnom.`,
                    };
                    return descs[this.product.category] || `${this.product.name} - kvalitetan proizvod iz naše ponude.`;
                },

                get productDescriptionLong() {
                    return this.productDescription + ` Ovaj proizvod iz kategorije ${this.product.subcategory} pažljivo je odabran za naš asortiman. Svaki artikl prolazi kroz strogu kontrolu kvalitete prije nego što dospije do vas. Nudimo garanciju autentičnosti i originalnosti svakog proizvoda u našoj ponudi. Uz besplatnu dostavu za narudžbe iznad 50€ i mogućnost povrata u roku od 30 dana, kupovina kod nas je sigurna i bezbrižna.`;
                },

                get productFeatures() {
                    const features = {
                        'Elektronika': ['Najnovija generacija tehnologije', 'Energetski učinkovit', 'Premium materijali i izrada', '24 mjeseca garancije', 'Kompatibilno s najnovijim standardima'],
                        'Odjeća': ['Premium materijali', 'Udoban kroj za svaki dan', 'Otpornost na pranje', 'Dostupno u više veličina', 'Moderan dizajn'],
                        'Obuća': ['Ergonomski dizajn', 'Kvalitetni materijali', 'Protuklizni đon', 'Prozračna konstrukcija', 'Dostupno u više veličina'],
                        'Kuća i vrt': ['Jednostavno za montažu', 'Izdržljivi materijali', 'Moderan dizajn', 'Lako za održavanje', 'Funkcionalnost na prvom mjestu'],
                        'Sport': ['Profesionalna kvaliteta', 'Lagani materijali', 'Ergonomski dizajn', 'Otpornost na habanje', 'Certificirano za natjecanja'],
                        'Ljepota i zdravlje': ['Dermatološki testirano', 'Bez parabena', 'Prirodni sastojci', 'Klinički dokazano', 'Za sve tipove kože'],
                        'Igračke': ['Certificirana sigurnost', 'Razvija kreativnost', 'Kvalitetni materijali', 'Za različite uzraste', 'Ekološki prihvatljivo'],
                        'Knjige': ['Kvalitetan tisak', 'Tvrdi/meki uvez', 'Bogato ilustrirano', 'Prevedeno na hrvatski', 'Savršen poklon'],
                    };
                    return features[this.product.category] || ['Kvalitetan proizvod', 'Brza dostava', 'Garancija kvalitete'];
                },

                get productSpecs() {
                    const specs = {
                        'Elektronika': [
                            { label: 'Brand', value: this.product.name.split(' ')[0] },
                            { label: 'Model', value: this.product.name },
                            { label: 'Kategorija', value: this.product.subcategory },
                            { label: 'Garancija', value: '24 mjeseca' },
                            { label: 'Zemlja podrijetla', value: 'Originalni proizvod' },
                            { label: 'Težina paketa', value: (0.3 + Math.random() * 2).toFixed(1) + ' kg' },
                        ],
                        'Odjeća': [
                            { label: 'Brand', value: this.product.name.split(' ')[0] },
                            { label: 'Materijal', value: '95% pamuk, 5% elastan' },
                            { label: 'Veličine', value: 'S, M, L, XL, XXL' },
                            { label: 'Održavanje', value: 'Pranje na 30°C' },
                            { label: 'Sezona', value: 'Sva godišnja doba' },
                        ],
                        'Obuća': [
                            { label: 'Brand', value: this.product.name.split(' ')[0] },
                            { label: 'Materijal', value: 'Koža / Sintetika' },
                            { label: 'Veličine', value: '38 - 46' },
                            { label: 'Đon', value: 'Gumeni, protuklizni' },
                            { label: 'Boja', value: 'Crna / Bijela' },
                        ],
                    };
                    return specs[this.product.category] || [
                        { label: 'Brand', value: this.product.name.split(' ')[0] },
                        { label: 'Kategorija', value: this.product.subcategory },
                        { label: 'Stanje', value: 'Novo' },
                        { label: 'Garancija', value: '12 mjeseci' },
                        { label: 'Dostava', value: 'Besplatna iznad 50€' },
                    ];
                },

                get ratingBars() {
                    const base = this.product.name.length;
                    return [
                        { stars: 5, percent: 45 + (base % 15) },
                        { stars: 4, percent: 25 + (base % 10) },
                        { stars: 3, percent: 10 + (base % 8) },
                        { stars: 2, percent: 3 + (base % 5) },
                        { stars: 1, percent: 1 + (base % 3) },
                    ];
                },

                get productReviews() {
                    return [
                        {
                            name: 'Ana M.',
                            avatar: 'https://picsum.photos/seed/reviewer1/80/80',
                            rating: 5,
                            date: '15.03.2026.',
                            text: `Odličan proizvod! ${this.product.name} je upravo ono što sam tražila. Kvaliteta je iznad očekivanja, a dostava je bila brza i uredna. Svakako preporučujem!`
                        },
                        {
                            name: 'Marko K.',
                            avatar: 'https://picsum.photos/seed/reviewer2/80/80',
                            rating: 4,
                            date: '28.02.2026.',
                            text: 'Vrlo zadovoljan kupovinom. Proizvod odgovara opisu, pakiranje uredno. Jedina mala zamjerka je što je dostava trajala dan duže od očekivanog.'
                        },
                        {
                            name: 'Ivana P.',
                            avatar: 'https://picsum.photos/seed/reviewer3/80/80',
                            rating: 5,
                            date: '10.02.2026.',
                            text: 'Kupila sam kao poklon i osoba je bila oduševljena! Kvaliteta materijala je vrhunska. Definitivno ću opet kupovati u FerShopu.'
                        },
                        {
                            name: 'Tomislav B.',
                            avatar: 'https://picsum.photos/seed/reviewer4/80/80',
                            rating: 4,
                            date: '22.01.2026.',
                            text: 'Dobar omjer cijene i kvalitete. Koristim već mjesec dana i sve funkcionira besprijekorno. FerShop ima odličnu korisničku podršku.'
                        },
                    ];
                },

                get relatedProducts() {
                    return this.products
                        .filter(p => p.category === this.product.category && p.name !== this.product.name)
                        .slice(0, 4);
                },

                init() {
                    document.title = this.product.name + ' | FerShop';
                },
            };
        }
    </script>

</body>
</html>
